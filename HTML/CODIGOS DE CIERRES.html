<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Códigos de Cierre</title>
  <style>
:root {
  --yellow: #fff600;
  --blue: #9ec2e4;
  --line: #111111;
  --paper: #ffffff;
  --text: #101010;
  --copy-bg: rgba(255,255,255,.94);
  --copy-hover: #ffffff;
  --blue-strong: #5f94c8;
  --muted: #616161;
  --surface: #f7f8fa;
  --focus: #1e73be;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #f1f1f1;
  color: var(--text);
  font-family: Arial, "Arial Narrow", Helvetica, sans-serif;
}

body { padding: 16px; }

.page-shell {
  width: min(1500px, 100%);
  margin: 0 auto;
}

.search-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
  padding: 12px;
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
}

.search-icon {
  position: absolute;
  left: 14px;
  font-size: 18px;
  pointer-events: none;
}

#searchInput {
  width: 100%;
  min-height: 48px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 10px 44px 10px 43px;
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  text-transform: uppercase;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}

#searchInput:focus {
  border-color: var(--focus);
  box-shadow: 0 0 0 3px rgba(30,115,190,.15);
}

.clear-search {
  position: absolute;
  right: 8px;
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
  display: none;
}

.clear-search.visible { display: block; }
.clear-search:hover { background: #ececec; }

.result-count {
  min-width: 138px;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 12px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: var(--yellow);
  font-size: 13px;
  font-weight: 900;
  text-align: center;
}

.table-card {
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 3px 14px rgba(0,0,0,.10);
  overflow: hidden;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

.closure-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  background: var(--paper);
}

.closure-table th,
.closure-table td {
  border: 1.8px solid var(--line);
}

.closure-table thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--yellow);
  color: #090909;
  text-align: center;
  font-size: clamp(18px, 2.15vw, 28px);
  line-height: 1.05;
  font-weight: 800;
  padding: 20px 12px;
}

.code-head { width: 35%; }

.code-cell {
  background: var(--blue);
  vertical-align: middle;
  padding: 16px 14px;
}

.code-main {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.code-number {
  flex: 0 0 auto;
  min-width: 26px;
  font-size: clamp(16px, 1.35vw, 22px);
  font-weight: 900;
  line-height: 1.25;
}

.code-title {
  flex: 1 1 auto;
  min-width: 0;
  font-size: clamp(15px, 1.3vw, 21px);
  line-height: 1.25;
  font-weight: 800;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}

.copy-btn {
  margin-top: 12px;
  border: 1.7px solid #111;
  background: var(--copy-bg);
  color: #111;
  border-radius: 7px;
  padding: 8px 11px;
  font: inherit;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .2px;
  cursor: pointer;
  box-shadow: 0 1px 0 rgba(0,0,0,.12);
  transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
}

.copy-btn:hover {
  background: var(--copy-hover);
  box-shadow: 0 2px 0 rgba(0,0,0,.18);
  transform: translateY(-1px);
}

.copy-btn:active { transform: translateY(0); }

.definition-cell {
  background: var(--paper);
  padding: 18px 12px;
  vertical-align: middle;
  font-size: clamp(14px, 1.18vw, 19px);
  line-height: 1.35;
  font-weight: 500;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}

.closure-table tbody tr { transition: filter .12s ease; }
.closure-table tbody tr:hover { filter: brightness(.985); }

.no-results {
  padding: 30px 16px !important;
  text-align: center;
  background: #fff !important;
  font-weight: 800;
  color: var(--muted);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translate(-50%, 16px);
  background: #111;
  color: #fff;
  border-radius: 8px;
  padding: 10px 14px;
  font-weight: 800;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
  z-index: 9999;
  box-shadow: 0 6px 22px rgba(0,0,0,.25);
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 760px) {
  body { padding: 7px; }
  .search-panel {
    grid-template-columns: 1fr;
    padding: 8px;
    border-width: 1.5px;
  }
  .result-count { min-width: 0; min-height: 40px; }
  #searchInput { min-height: 46px; font-size: 15px; }
  .table-card { border-width: 1px; border-radius: 8px; }
  .closure-table { min-width: 760px; }
  .closure-table thead th { padding: 16px 8px; }
  .code-cell { padding: 13px 10px; }
  .definition-cell { padding: 14px 10px; }
}

@media print {
  body { background: #fff; padding: 0; }
  .table-card { border: 0; box-shadow: none; }
  .copy-btn, .toast, .search-panel { display: none !important; }
  .closure-table thead th { position: static; }
}

  </style>
</head>
<body>
  <main class="page-shell">
    <section class="search-panel" aria-label="Buscador de códigos de cierre">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="BUSCAR POR NÚMERO, CÓDIGO O DEFINICIÓN..." aria-label="Buscar código de cierre">
        <button id="clearSearch" class="clear-search" type="button" aria-label="Limpiar búsqueda">×</button>
      </div>
      <div id="resultCount" class="result-count" aria-live="polite"></div>
    </section>

    <section class="table-card" aria-label="Códigos de cierre">
      <div class="table-wrap">
        <table class="closure-table">
          <thead>
            <tr>
              <th class="code-head">CODIGO DE CIERRE</th>
              <th>DEFINICION</th>
            </tr>
          </thead>
          <tbody id="codesBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

    definition: "DE ACUERDO A LAS NOTAS DEL INCIDENTE, SE EMPLEA CUANDO SE REALIZAN EN EL LUGAR INVESTIGACIONES Y LABORES DE INTELIGENCIA POR UN SEGUIMIENTO DE ACTOS DELICTIVOS."

const body = document.getElementById("codesBody");
const toast = document.getElementById("toast");
const searchInput = document.getElementById("searchInput");
const clearSearch = document.getElementById("clearSearch");
const resultCount = document.getElementById("resultCount");
let toastTimer;

function normalizeText(text) {
  return String(text ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toUpperCase();
}

function renderCodes(query = "") {
  const term = normalizeText(query.trim());
  const filtered = term
    ? closureCodes.filter(item =>
        normalizeText(item.code).includes(term) ||
        normalizeText(item.title).includes(term) ||
        normalizeText(item.definition).includes(term)
      )
    : closureCodes;

  resultCount.textContent = `${filtered.length} DE ${closureCodes.length} CÓDIGOS`;
  clearSearch.classList.toggle("visible", Boolean(query));

  if (!filtered.length) {
    body.innerHTML = `<tr><td colspan="2" class="no-results">NO SE ENCONTRARON CÓDIGOS CON ESA BÚSQUEDA.</td></tr>`;
    return;
  }

  body.innerHTML = filtered.map(item => `
    <tr>
      <td class="code-cell">
        <div class="code-main">
          <span class="code-number">${item.code}</span>
          <span class="code-title">${escapeHtml(item.title)}</span>
        </div>
        <button class="copy-btn" type="button" data-code="${item.code}" aria-label="Copiar ${escapeHtml(item.title)}">
          COPIAR CÓDIGO DE CIERRE
        </button>
      </td>
      <td class="definition-cell">${escapeHtml(item.definition)}</td>
    </tr>
  `).join("");
}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return;
  }

  const temp = document.createElement("textarea");
  temp.value = text;
  temp.setAttribute("readonly", "");
  temp.style.position = "fixed";
  temp.style.left = "-9999px";
  document.body.appendChild(temp);
  temp.select();
  const ok = document.execCommand("copy");
  temp.remove();
  if (!ok) throw new Error("No se pudo copiar");
}

function showToast(message) {
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add("show");
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
}

body.addEventListener("click", async event => {
  const button = event.target.closest(".copy-btn");
  if (!button) return;

  const code = Number(button.dataset.code);
  const item = closureCodes.find(entry => entry.code === code);
  if (!item) return;

  const textToCopy = item.title;

  try {
    await copyText(textToCopy);
    const original = button.textContent;
    button.textContent = "COPIADO ✓";
    showToast("CÓDIGO DE CIERRE COPIADO ✓");
    setTimeout(() => { button.textContent = original; }, 1000);
  } catch (error) {
    showToast("No se pudo copiar");
  }
});

searchInput.addEventListener("input", () => {
  renderCodes(searchInput.value);
});

clearSearch.addEventListener("click", () => {
  searchInput.value = "";
  renderCodes();
  searchInput.focus();
});

searchInput.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    searchInput.value = "";
    renderCodes();
  }
});

renderCodes();

  </script>
