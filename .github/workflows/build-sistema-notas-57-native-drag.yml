name: Build Sistema Notas 5.7 Native Drag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-sistema-notas-57-native-drag.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Patch original interface and build backend
        shell: pwsh
        run: ./build57/patch-and-build.ps1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Electron runtime
        shell: pwsh
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE '.build57\electron'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\build57\*" $work -Recurse -Force
          Push-Location $work
          npm install --no-audit --no-fund
          Pop-Location

      - name: Build APP SERVIDOR
        shell: pwsh
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE '.build57\electron'
          $out = Join-Path $env:GITHUB_WORKSPACE '.build57\out\server'
          Push-Location $work
          npx electron-builder --win portable --x64 --config.directories.output="$out" --config.productName="APP SERVIDOR" --config.appId="mx.c5.sistemanotas.servidor57" --config.extraMetadata.main="server.js" --config.artifactName="APP SERVIDOR.exe" --config.extraResources[0].from="$env:GITHUB_WORKSPACE\.build57\backend.exe" --config.extraResources[0].to="backend.exe"
          Pop-Location

      - name: Build APP SUPERVISOR
        shell: pwsh
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE '.build57\electron'
          $out = Join-Path $env:GITHUB_WORKSPACE '.build57\out\supervisor'
          Push-Location $work
          npx electron-builder --win portable --x64 --config.directories.output="$out" --config.productName="APP SUPERVISOR" --config.appId="mx.c5.sistemanotas.supervisor57" --config.extraMetadata.main="supervisor.js" --config.artifactName="APP SUPERVISOR.exe"
          Pop-Location

      - name: Build APP DESPACHO
        shell: pwsh
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE '.build57\electron'
          $out = Join-Path $env:GITHUB_WORKSPACE '.build57\out\despacho'
          Push-Location $work
          npx electron-builder --win portable --x64 --config.directories.output="$out" --config.productName="APP DESPACHO" --config.appId="mx.c5.sistemanotas.despacho57" --config.extraMetadata.main="despacho.js" --config.artifactName="APP DESPACHO.exe"
          Pop-Location

      - name: Collect files
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE '.build57\DIST'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\.build57\out\server\APP SERVIDOR.exe" $dist
          Copy-Item "$env:GITHUB_WORKSPACE\.build57\out\supervisor\APP SUPERVISOR.exe" $dist
          Copy-Item "$env:GITHUB_WORKSPACE\.build57\out\despacho\APP DESPACHO.exe" $dist
          Get-FileHash "$dist\APP SERVIDOR.exe" -Algorithm SHA256
          Get-FileHash "$dist\APP SUPERVISOR.exe" -Algorithm SHA256
          Get-FileHash "$dist\APP DESPACHO.exe" -Algorithm SHA256

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_NOTAS_5_7_TRES_APPS_NATIVE_DRAG
          path: .build57/DIST/*.exe
          if-no-files-found: error
          retention-days: 7
