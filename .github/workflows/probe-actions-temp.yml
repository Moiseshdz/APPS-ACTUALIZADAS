name: Temporary Actions Probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-actions-temp.yml]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record latest Sistema Notas build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          DATA=$(gh run list --workflow build-sistema-notas-55-main.yml --limit 5 --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha 2>&1 || true)
          JSON=$(jq -n --arg probe_run "$GITHUB_RUN_ID" --arg build_runs "$DATA" '{probe_run_id:$probe_run,build_runs_raw:$build_runs}')
          CONTENT=$(printf '%s' "$JSON" | base64 -w0)
          OLD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.actions-probe.json?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            jq -n --arg message '[skip ci] Actions build probe' --arg content "$CONTENT" --arg branch main --arg sha "$OLD_SHA" '{message:$message,content:$content,branch:$branch,sha:$sha}' | gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/contents/.actions-probe.json" --input -
          else
            jq -n --arg message '[skip ci] Actions build probe' --arg content "$CONTENT" --arg branch main '{message:$message,content:$content,branch:$branch}' | gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/contents/.actions-probe.json" --input -
          fi
