name: Track Sistema Notas 5.5 Build

on:
  push:
    branches:
      - build-sistema-notas-5-5-self-contained

permissions:
  contents: write
  actions: read

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for build and record artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          CONCLUSION=""
          for i in $(seq 1 100); do
            DATA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")
            RUN_ID=$(echo "$DATA" | jq -r '.workflow_runs[] | select(.name=="Build Sistema Notas 5.5 Self Contained") | .id' | head -n1)
            CONCLUSION=$(echo "$DATA" | jq -r '.workflow_runs[] | select(.name=="Build Sistema Notas 5.5 Self Contained") | .conclusion // ""' | head -n1)
            if [ -n "$RUN_ID" ] && [ -n "$CONCLUSION" ]; then break; fi
            sleep 15
          done
          if [ -z "$RUN_ID" ]; then
            echo '{"ok":false,"error":"No se encontró la ejecución de compilación"}' > .build55-result.json
          elif [ "$CONCLUSION" != "success" ]; then
            printf '{"ok":false,"run_id":%s,"conclusion":"%s"}\n' "$RUN_ID" "$CONCLUSION" > .build55-result.json
          else
            ART=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")
            ART_ID=$(echo "$ART" | jq -r '.artifacts[] | select(.name=="SISTEMA_NOTAS_5_5_DOS_EXE") | .id' | head -n1)
            ART_SIZE=$(echo "$ART" | jq -r '.artifacts[] | select(.name=="SISTEMA_NOTAS_5_5_DOS_EXE") | .size_in_bytes' | head -n1)
            printf '{"ok":true,"run_id":%s,"artifact_id":%s,"artifact_size":%s}\n' "$RUN_ID" "$ART_ID" "$ART_SIZE" > .build55-result.json
          fi
          cat .build55-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build55-result.json
          git commit -m "[skip ci] record Sistema Notas 5.5 build result" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
