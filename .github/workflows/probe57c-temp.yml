name: Probe Final 5.7C
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe57c-temp.yml]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record final build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 8
          DATA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-sistema-notas-57c-final.yml/runs?per_page=5")
          CONTENT=$(printf '%s' "$DATA" | base64 -w0)
          jq -n --arg message '[skip ci] probe final 5.7C' --arg content "$CONTENT" --arg branch main '{message:$message,content:$content,branch:$branch}' | gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/contents/.build57c-probe.json" --input -
