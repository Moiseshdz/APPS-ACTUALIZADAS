name: ChatLAN Android v13 Build

on:
  push:
    branches: ["chatlan-v11-whatsapp-features"]
    paths:
      - '.chatlan_build/patch_v12.py'
      - '.chatlan_build/patch_v13_extra.py'
      - '.github/workflows/chatlan-v11-build.yml'
  pull_request:
    branches: ["main"]
    paths:
      - '.chatlan_build/**'
      - '.github/workflows/chatlan-v11-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare v13 project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/chatlan
          cat .chatlan_build/bin*.part > /tmp/chatlan-project.zip
          test "$(wc -c < /tmp/chatlan-project.zip)" -eq 38530
          echo "c09905f4fdb495f5122352f6c8cedc05a181d37cf58c3b0d2db8b909bc21f46b  /tmp/chatlan-project.zip" | sha256sum -c -
          unzip -q /tmp/chatlan-project.zip -d /tmp/chatlan
          python .chatlan_build/patch_v12.py
          python .chatlan_build/patch_v13_extra.py
          grep "versionCode 13" /tmp/chatlan/chat_lan_v11_project/app/build.gradle
          grep "APP_VERSION_CODE=13" /tmp/chatlan/chat_lan_v11_project/app/src/main/assets/index.html
          grep "SUPABASE_URL='https://mowzkwpdqhnkvruhxbts.supabase.co'" /tmp/chatlan/chat_lan_v11_project/app/src/main/assets/index.html
          ! grep -q "firebase-storage.js" /tmp/chatlan/chat_lan_v11_project/app/src/main/assets/index.html
          python - <<'PY'
          from pathlib import Path
          t=Path('/tmp/chatlan/chat_lan_v11_project/app/src/main/assets/index.html').read_text()
          s=t.rfind('<script type="module">'); e=t.rfind('</script>')
          Path('/tmp/chatlan/index.js').write_text(t[s+len('<script type="module">'):e])
          PY
          node --check /tmp/chatlan/index.js
      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build
        working-directory: /tmp/chatlan/chat_lan_v11_project
        run: |
          gradle :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Validate and package
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="/tmp/chatlan/chat_lan_v11_project/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep "package: name='com.chatlan.app'" /tmp/badging.txt
          grep "versionCode='13'" /tmp/badging.txt
          mkdir -p out/build-tools-35.0.0/lib
          cp "$APK" out/ChatLAN_Android_v13_UNSIGNED.apk
          cp "$BT/apksigner" out/build-tools-35.0.0/apksigner
          cp "$BT/lib/apksigner.jar" out/build-tools-35.0.0/lib/apksigner.jar
          cp "$BT/zipalign" out/build-tools-35.0.0/zipalign
          cp "$BT/aapt" out/build-tools-35.0.0/aapt
          cp /tmp/badging.txt out/android-badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChatLAN-Android-v13-build
          path: out/
          retention-days: 1
