name: ChatLAN Android v13 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare v13 project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/chatlan
          cat .chatlan_build/bin*.part > /tmp/chatlan-project.zip
          unzip -q /tmp/chatlan-project.zip -d /tmp/chatlan
          python .chatlan_build/patch_v12.py
          python .chatlan_build/patch_v13_extra.py
          grep "versionCode 13" /tmp/chatlan/chat_lan_v11_project/app/build.gradle
          grep "APP_VERSION_CODE=13" /tmp/chatlan/chat_lan_v11_project/app/src/main/assets/index.html
          ! grep -q "firebase-storage.js" /tmp/chatlan/chat_lan_v11_project/app/src/main/assets/index.html
      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build
        working-directory: /tmp/chatlan/chat_lan_v11_project
        run: gradle :app:assembleRelease --stacktrace
