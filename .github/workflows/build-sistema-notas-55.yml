appId: mx.chiapas.sistemanotas.supervisor
productName: APP SUPERVISOR
directories:
  output: dist-supervisor
files:
  - common.js
  - supervisor.js
  - package.json
extraMetadata:
  main: supervisor.js
extraResources:
  - from: ../backend.exe
    to: backend.exe
asar: true
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: APP SUPERVISOR.exe
  signAndEditExecutable: false
portable:
  artifactName: APP SUPERVISOR.exe
'@ | Set-Content -Path (Join-Path $work 'builder-supervisor.yml') -Encoding utf8

          @'
appId: mx.chiapas.sistemanotas.despacho
productName: APP DESPACHO
directories:
  output: dist-despacho
files:
  - common.js
  - despacho.js
  - package.json
extraMetadata:
  main: despacho.js
asar: true
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: APP DESPACHO.exe
  signAndEditExecutable: false
portable:
  artifactName: APP DESPACHO.exe
'@ | Set-Content -Path (Join-Path $work 'builder-despacho.yml') -Encoding utf8

      - name: Install Electron dependencies
        shell: pwsh
        working-directory: .build55/electron
        run: npm install --no-audit --no-fund

      - name: Build APP SUPERVISOR and APP DESPACHO
        shell: pwsh
        working-directory: .build55/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --config builder-supervisor.yml
          npx electron-builder --config builder-despacho.yml
          $out = Join-Path $env:GITHUB_WORKSPACE '.build55\out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item '.\dist-supervisor\APP SUPERVISOR.exe' (Join-Path $out 'APP SUPERVISOR.exe')
          Copy-Item '.\dist-despacho\APP DESPACHO.exe' (Join-Path $out 'APP DESPACHO.exe')
          Get-FileHash (Join-Path $out 'APP SUPERVISOR.exe') -Algorithm SHA256
          Get-FileHash (Join-Path $out 'APP DESPACHO.exe') -Algorithm SHA256

      - name: Upload two EXE files
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_NOTAS_5_5_DOS_EXE
          path: |
            .build55/out/APP SUPERVISOR.exe
            .build55/out/APP DESPACHO.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
