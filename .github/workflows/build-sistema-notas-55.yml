name: Build Sistema Notas 5.5 Self Contained

on:
  push:
    branches:
      - build-sistema-notas-5-5-self-contained
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build original 4.6 backend without external browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srcDir = Join-Path $env:GITHUB_WORKSPACE 'SISTEMA_NOTAS_LOCAL_4_6\codigo_fuente'
          $main = Join-Path $srcDir 'main.go'
          $s = Get-Content $main -Raw
          $s = $s -replace "`r`n", "`n"
          $s = $s.Replace('appVersion     = "4.6.0-buscador-resultados-sin-select"', 'appVersion     = "5.5.0-interfaz-original-autocontenida"')
          $oldBrowser = @'
	go func() {
		time.Sleep(650 * time.Millisecond)
		openBrowser(baseURL)
	}()
'@
          $newBrowser = @'
	if strings.TrimSpace(os.Getenv("SISTEMA_NOTAS_NO_BROWSER")) != "1" {
		go func() {
			time.Sleep(650 * time.Millisecond)
			openBrowser(baseURL)
		}()
	}
'@
          if (-not $s.Contains($oldBrowser)) { throw 'No se encontró el bloque de apertura del navegador.' }
          $s = $s.Replace($oldBrowser, $newBrowser)
          $oldRoot = @'
func applicationDir() (string, error) {
	exe, err := os.Executable()
	if err != nil {
		return "", err
	}
	return filepath.Dir(exe), nil
}
'@
          $newRoot = @'
func applicationDir() (string, error) {
	if root := strings.TrimSpace(os.Getenv("SISTEMA_NOTAS_ROOT")); root != "" {
		if err := os.MkdirAll(root, 0755); err != nil {
			return "", err
		}
		return root, nil
	}
	exe, err := os.Executable()
	if err != nil {
		return "", err
	}
	return filepath.Dir(exe), nil
}
'@
          if (-not $s.Contains($oldRoot)) { throw 'No se encontró applicationDir.' }
          $s = $s.Replace($oldRoot, $newRoot)
          Set-Content -Path $main -Value $s -Encoding utf8 -NoNewline
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE '.build55'
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null
          Push-Location $srcDir
          go test .\main.go
          go build -trimpath -ldflags "-H windowsgui -s -w" -o (Join-Path $buildRoot 'backend.exe') .\main.go
          Pop-Location

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Electron wrapper with bundled Chromium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:GITHUB_WORKSPACE '.build55\electron'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          @'
{
  "name": "sistema-notas-escritorio",
  "version": "5.5.0",
  "private": true,
  "description": "Sistema de Notas con interfaz original y Chromium autocontenido",
  "main": "supervisor.js",
  "devDependencies": {
    "electron": "43.3.0",
    "electron-builder": "26.0.12"
  }
}
'@ | Set-Content -Path (Join-Path $work 'package.json') -Encoding utf8

          @'
const { BrowserWindow, dialog } = require('electron');
const fs = require('fs');
const path = require('path');
const os = require('os');
const http = require('http');
const dgram = require('dgram');
const FIRST_PORT = 8765;
const LAST_PORT = 8795;
const DISCOVERY_PORT = 18765;
const DISCOVERY_TOKEN = 'SISTEMA_NOTAS_DISCOVER_55';
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function statusAt(host, port, timeout = 800) {
  return new Promise(resolve => {
    const req = http.get({ host, port, path: '/api/status', timeout }, res => {
      let body = '';
      res.setEncoding('utf8');
      res.on('data', c => body += c);
      res.on('end', () => {
        try {
          const data = JSON.parse(body);
          if (res.statusCode === 200 && data && data.ok && data.family === 'sistema-notas-local') resolve({ ok:true, data, url:`http://${host}:${port}/`, port });
          else resolve({ ok:false });
        } catch { resolve({ ok:false }); }
      });
    });
    req.on('timeout', () => req.destroy());
    req.on('error', () => resolve({ ok:false }));
  });
}
async function findLocalServer(timeoutMs = 18000) {
  const started = Date.now();
  while (Date.now() - started < timeoutMs) {
    for (let port = FIRST_PORT; port <= LAST_PORT; port++) {
      const s = await statusAt('127.0.0.1', port, 350);
      if (s.ok) return s;
    }
    await sleep(250);
  }
  return null;
}
function localIPv4() {
  const result = [];
  for (const entries of Object.values(os.networkInterfaces())) for (const item of entries || []) if (item.family === 'IPv4' && !item.internal && item.address) result.push(item.address);
  return [...new Set(result)];
}
function firstLanIPv4() { return localIPv4()[0] || '127.0.0.1'; }
function startDiscoveryResponder(getPort) {
  const socket = dgram.createSocket({type:'udp4',reuseAddr:true});
  socket.on('error',()=>{});
  socket.on('message',(msg,rinfo)=>{
    if (msg.toString('utf8').trim() !== DISCOVERY_TOKEN) return;
    const port = Number(getPort()); if (!port) return;
    const payload = Buffer.from(JSON.stringify({app:'Sistema de Notas',family:'sistema-notas-local',version:'5.5',url:`http://${firstLanIPv4()}:${port}/`}),'utf8');
    socket.send(payload,rinfo.port,rinfo.address,()=>{});
  });
  try { socket.bind(DISCOVERY_PORT,'0.0.0.0'); } catch {}
  return socket;
}
function discoverByUdp(timeoutMs = 1800) {
  return new Promise(resolve=>{
    const socket=dgram.createSocket('udp4'); let done=false;
    const finish=value=>{if(done)return;done=true;try{socket.close();}catch{}resolve(value);};
    socket.on('error',()=>finish(null));
    socket.on('message',async msg=>{try{const data=JSON.parse(msg.toString('utf8'));if(data.family!=='sistema-notas-local'||!data.url)return;const u=new URL(data.url);const s=await statusAt(u.hostname,Number(u.port||FIRST_PORT),800);if(s.ok)finish(s.url);}catch{}});
    socket.bind(0,()=>{try{socket.setBroadcast(true);const data=Buffer.from(DISCOVERY_TOKEN,'utf8');socket.send(data,DISCOVERY_PORT,'255.255.255.255',()=>{});for(const ip of localIPv4()){const parts=ip.split('.');if(parts.length===4){parts[3]='255';socket.send(data,DISCOVERY_PORT,parts.join('.'),()=>{});}}}catch{}});
    setTimeout(()=>finish(null),timeoutMs);
  });
}
async function scanSubnet() {
  const prefixes=[...new Set(localIPv4().map(ip=>ip.split('.').slice(0,3).join('.')).filter(Boolean))];
  for(const prefix of prefixes){
    const targets=[];for(let i=1;i<=254;i++)for(let p=FIRST_PORT;p<=LAST_PORT;p++)targets.push([`${prefix}.${i}`,p]);
    let found=null,index=0;
    const workers=Array.from({length:64},async()=>{while(!found&&index<targets.length){const [host,port]=targets[index++];const s=await statusAt(host,port,200);if(s.ok){found=s.url;break;}}});
    await Promise.all(workers);if(found)return found;
  }
  return null;
}
async function resolveRemoteServer(savedUrl) {
  if(savedUrl){try{const u=new URL(savedUrl);const s=await statusAt(u.hostname,Number(u.port||FIRST_PORT),1000);if(s.ok)return s.url;}catch{}}
  const udp=await discoverByUdp();if(udp)return udp;return await scanSubnet();
}
function openAppWindow(url,role) {
  const win=new BrowserWindow({width:1500,height:930,minWidth:1050,minHeight:720,show:false,backgroundColor:'#dedede',autoHideMenuBar:true,title:role==='supervisor'?'APP SUPERVISOR — Sistema de Notas':'APP DESPACHO — Sistema de Notas',webPreferences:{nodeIntegration:false,contextIsolation:true,sandbox:true,spellcheck:true,backgroundThrottling:false}});
  win.setMenuBarVisibility(false);
  win.webContents.setWindowOpenHandler(({url:target})=>{try{if(new URL(target).origin===new URL(url).origin)return{action:'allow'};}catch{}return{action:'deny'};});
  win.webContents.on('will-navigate',(event,target)=>{try{if(new URL(target).origin!==new URL(url).origin)event.preventDefault();}catch{event.preventDefault();}});
  win.once('ready-to-show',()=>{win.maximize();win.show();});
  win.loadURL(url).catch(async err=>{await dialog.showMessageBox(win,{type:'error',title:'Sistema de Notas',message:'No se pudo cargar la interfaz original.',detail:String(err?.message||err)});});
  return win;
}
function readTextSafe(file){try{return fs.readFileSync(file,'utf8').trim();}catch{return'';}}
function writeTextSafe(file,value){try{fs.mkdirSync(path.dirname(file),{recursive:true});fs.writeFileSync(file,value,'utf8');}catch{}}
module.exports={FIRST_PORT,LAST_PORT,sleep,statusAt,findLocalServer,localIPv4,startDiscoveryResponder,resolveRemoteServer,openAppWindow,readTextSafe,writeTextSafe};
'@ | Set-Content -Path (Join-Path $work 'common.js') -Encoding utf8

          @'
const { app, dialog } = require('electron');
app.disableHardwareAcceleration();
const path=require('path');const fs=require('fs');const {spawn}=require('child_process');const http=require('http');
const {findLocalServer,startDiscoveryResponder,openAppWindow}=require('./common');
const portableDir=process.env.PORTABLE_EXECUTABLE_DIR||path.dirname(process.execPath);
const baseDataRoot=path.join(process.env.LOCALAPPDATA||app.getPath('appData'),'SistemaNotasSupervisor');
app.setPath('userData',path.join(baseDataRoot,'Electron'));
let backend=null,responder=null,currentServer=null,mainWindow=null,quitting=false;
function copyDirIfNeeded(source,target){try{if(!fs.existsSync(source)||fs.existsSync(target))return;fs.mkdirSync(path.dirname(target),{recursive:true});fs.cpSync(source,target,{recursive:true});}catch{}}
function migrateLegacyData(){const targetDatos=path.join(baseDataRoot,'datos');const candidates=[path.join(portableDir,'datos'),path.join(path.dirname(portableDir),'datos')];if(!fs.existsSync(targetDatos))for(const source of candidates)if(fs.existsSync(path.join(source,'sistema_notas.db.json'))){copyDirIfNeeded(source,targetDatos);break;}const targetResp=path.join(baseDataRoot,'respaldos');for(const source of [path.join(portableDir,'respaldos'),path.join(path.dirname(portableDir),'respaldos')])if(fs.existsSync(source)){copyDirIfNeeded(source,targetResp);break;}}
function backendPath(){return app.isPackaged?path.join(process.resourcesPath,'backend.exe'):path.join(__dirname,'..','backend.exe');}
async function stopBackend(){if(currentServer)try{await new Promise(resolve=>{const u=new URL(currentServer.url);const req=http.request({hostname:u.hostname,port:u.port,path:'/api/shutdown',method:'POST',timeout:700},res=>{res.resume();resolve();});req.on('error',resolve);req.on('timeout',()=>{req.destroy();resolve();});req.end('{}');});}catch{}if(backend&&!backend.killed)try{backend.kill();}catch{}}
app.whenReady().then(async()=>{migrateLegacyData();fs.mkdirSync(baseDataRoot,{recursive:true});const exe=backendPath();if(!fs.existsSync(exe)){await dialog.showMessageBox({type:'error',title:'APP SUPERVISOR',message:'No se encontró el servidor interno.'});app.quit();return;}backend=spawn(exe,['--servidor'],{windowsHide:true,cwd:baseDataRoot,env:{...process.env,SISTEMA_NOTAS_ROOT:baseDataRoot,SISTEMA_NOTAS_NO_BROWSER:'1'},stdio:'ignore'});currentServer=await findLocalServer(18000);if(!currentServer){await dialog.showMessageBox({type:'error',title:'APP SUPERVISOR',message:'No se pudo iniciar el servidor interno.',detail:'Cierra copias anteriores de Sistema de Notas y vuelve a abrir APP SUPERVISOR.'});app.quit();return;}responder=startDiscoveryResponder(()=>currentServer.port);mainWindow=openAppWindow(`${currentServer.url}?vista=dashboard`,'supervisor');});
app.on('before-quit',async event=>{if(quitting)return;quitting=true;event.preventDefault();try{responder?.close();}catch{}await stopBackend();app.exit(0);});
app.on('window-all-closed',()=>app.quit());
'@ | Set-Content -Path (Join-Path $work 'supervisor.js') -Encoding utf8

          @'
const { app, BrowserWindow, ipcMain }=require('electron');
app.disableHardwareAcceleration();
const path=require('path');const fs=require('fs');const {resolveRemoteServer,openAppWindow,readTextSafe,writeTextSafe,statusAt}=require('./common');
const baseDataRoot=path.join(process.env.LOCALAPPDATA||app.getPath('appData'),'SistemaNotasDespacho');app.setPath('userData',path.join(baseDataRoot,'Electron'));const configFile=path.join(baseDataRoot,'servidor.txt');let mainWindow=null,configWindow=null;
async function validateUrl(raw){let text=String(raw||'').trim();if(!/^https?:\/\//i.test(text))text='http://'+text;const u=new URL(text);const port=Number(u.port||8765);const s=await statusAt(u.hostname,port,1500);if(!s.ok)throw new Error('No se encontró APP SUPERVISOR en esa dirección.');return s.url;}
function openConfigWindow(){configWindow=new BrowserWindow({width:650,height:440,resizable:false,autoHideMenuBar:true,title:'APP DESPACHO — Conectar con Supervisor',webPreferences:{nodeIntegration:true,contextIsolation:false}});configWindow.setMenuBarVisibility(false);const saved=readTextSafe(configFile);const page=`<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#dedede;font-family:Segoe UI,Arial,sans-serif;color:#173d59;display:grid;place-items:center;min-height:100vh}.card{width:590px;background:#fff;border:2px solid #0d3553;border-radius:18px;padding:28px;box-shadow:0 15px 40px #0002}.head{display:flex;align-items:center;gap:15px}.badge{width:54px;height:54px;border-radius:14px;background:#154e73;color:#ffcc00;display:grid;place-items:center;font-weight:900;font-size:24px}h1{margin:0;font-size:23px}.sub{color:#5d6f7b;line-height:1.5;margin:8px 0 22px}label{font-weight:800;display:block;margin-bottom:7px}input{width:100%;height:48px;border:2px solid #0d3553;border-radius:10px;padding:0 12px;font-size:16px}button{width:100%;height:50px;margin-top:15px;border:2px solid #0d3553;border-radius:10px;background:#154e73;color:#ffcc00;font-size:16px;font-weight:900;cursor:pointer}.error{min-height:22px;color:#a32235;margin-top:12px;font-weight:600}.small{font-size:13px;color:#697b86;margin-top:8px}</style></head><body><div class="card"><div class="head"><div class="badge">911</div><div><h1>Conectar con APP SUPERVISOR</h1><div class="sub">No se encontró automáticamente el servidor. Escribe la IP de la PC de Supervisión.</div></div></div><label>Dirección del Supervisor</label><input id="server" value="${saved.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" placeholder="192.168.1.73:8765"><button id="go">CONECTAR</button><div class="error" id="error"></div><div class="small">La dirección quedará guardada para la próxima vez.</div></div><script>const {ipcRenderer}=require('electron');const b=document.getElementById('go'),i=document.getElementById('server'),e=document.getElementById('error');async function go(){e.textContent='Conectando…';b.disabled=true;const r=await ipcRenderer.invoke('connect-server',i.value);if(!r.ok){e.textContent=r.error;b.disabled=false}}b.onclick=go;i.onkeydown=x=>{if(x.key==='Enter')go()}</script></body></html>`;configWindow.loadURL('data:text/html;charset=utf-8,'+encodeURIComponent(page));}
ipcMain.handle('connect-server',async(_e,value)=>{try{const url=await validateUrl(value);writeTextSafe(configFile,url);configWindow?.close();configWindow=null;mainWindow=openAppWindow(`${url}?vista=registro`,'despacho');return{ok:true};}catch(err){return{ok:false,error:err.message||String(err)};}});
app.whenReady().then(async()=>{fs.mkdirSync(baseDataRoot,{recursive:true});const saved=readTextSafe(configFile);const url=await resolveRemoteServer(saved);if(url){writeTextSafe(configFile,url);mainWindow=openAppWindow(`${url}?vista=registro`,'despacho');}else openConfigWindow();});
app.on('window-all-closed',()=>app.quit());
