name: Probe Sistema Notas 5.5 Status
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-build55-status.yml]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record latest build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 2
          DATA=$(gh run list --workflow build-sistema-notas-55-main.yml --limit 5 --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha)
          CONTENT=$(printf '%s' "$DATA" | base64 -w0)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.build55-status.json?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            jq -n --arg message '[skip ci] build55 status' --arg content "$CONTENT" --arg branch main --arg sha "$SHA" '{message:$message,content:$content,branch:$branch,sha:$sha}' | gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/contents/.build55-status.json" --input -
          else
            jq -n --arg message '[skip ci] build55 status' --arg content "$CONTENT" --arg branch main '{message:$message,content:$content,branch:$branch}' | gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/contents/.build55-status.json" --input -
          fi
