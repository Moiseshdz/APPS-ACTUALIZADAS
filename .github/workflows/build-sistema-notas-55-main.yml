name: Build Sistema Notas 5.5 Verified

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-sistema-notas-55-main.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: build-sistema-notas-5-5-self-contained

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Patch and build original 4.6 server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $main = Join-Path $env:GITHUB_WORKSPACE 'SISTEMA_NOTAS_LOCAL_4_6\codigo_fuente\main.go'
          $s = Get-Content $main -Raw
          $s = $s.Replace('appVersion     = "4.6.0-buscador-resultados-sin-select"', 'appVersion     = "5.5.0-interfaz-original-autocontenida"')
          $old1 = "`tgo func() {`r`n`t`ttime.Sleep(650 * time.Millisecond)`r`n`t`topenBrowser(baseURL)`r`n`t}()"
          $new1 = "`tif strings.TrimSpace(os.Getenv(`"SISTEMA_NOTAS_NO_BROWSER`")) != `"1`" {`r`n`t`tgo func() {`r`n`t`t`ttime.Sleep(650 * time.Millisecond)`r`n`t`t`topenBrowser(baseURL)`r`n`t`t}()`r`n`t}"
          if (-not $s.Contains($old1)) {
            $old1 = "`tgo func() {`n`t`ttime.Sleep(650 * time.Millisecond)`n`t`topenBrowser(baseURL)`n`t}()"
            $new1 = "`tif strings.TrimSpace(os.Getenv(`"SISTEMA_NOTAS_NO_BROWSER`")) != `"1`" {`n`t`tgo func() {`n`t`t`ttime.Sleep(650 * time.Millisecond)`n`t`t`topenBrowser(baseURL)`n`t`t}()`n`t}"
          }
          if (-not $s.Contains($old1)) { throw 'No se encontró apertura externa del navegador.' }
          $s = $s.Replace($old1, $new1)
          $needle = "func applicationDir() (string, error) {"
          $replacement = "func applicationDir() (string, error) {`r`n`tif root := strings.TrimSpace(os.Getenv(`"SISTEMA_NOTAS_ROOT`")); root != `"`" {`r`n`t`tif err := os.MkdirAll(root, 0755); err != nil {`r`n`t`t`treturn `"`", err`r`n`t`t}`r`n`t`treturn root, nil`r`n`t}"
          if ($s -notmatch "`r`n") { $replacement = $replacement.Replace("`r`n", "`n") }
          if (-not $s.Contains($needle)) { throw 'No se encontró applicationDir.' }
          $s = $s.Replace($needle, $replacement)
          Set-Content $main -Value $s -Encoding utf8 -NoNewline
          $out = Join-Path $env:GITHUB_WORKSPACE 'build55-electron\backend.exe'
          Push-Location (Split-Path $main)
          go test .\main.go
          go build -trimpath -ldflags "-H windowsgui -s -w" -o $out .\main.go
          Pop-Location
          if (-not (Test-Path $out)) { throw 'No se generó backend.exe.' }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install self-contained Chromium runtime
        working-directory: build55-electron
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build the two portable EXE apps
        working-directory: build55-electron
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --config builder-supervisor.yml
          npx electron-builder --config builder-despacho.yml
          New-Item -ItemType Directory -Force -Path verified | Out-Null
          Copy-Item '.\dist-supervisor\APP SUPERVISOR.exe' '.\verified\APP SUPERVISOR.exe'
          Copy-Item '.\dist-despacho\APP DESPACHO.exe' '.\verified\APP DESPACHO.exe'
          $files = Get-ChildItem '.\verified' -File
          if ($files.Count -ne 2) { throw "Se esperaban exactamente 2 EXE y se encontraron $($files.Count)." }
          foreach ($f in $files) {
            if ($f.Length -lt 50000000) { throw "$($f.Name) no contiene el runtime Chromium completo." }
            Get-FileHash $f.FullName -Algorithm SHA256 | Format-List
          }

      - name: Upload verified Windows apps
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_NOTAS_5_5_VERIFICADO_WINDOWS
          path: |
            build55-electron/verified/APP SUPERVISOR.exe
            build55-electron/verified/APP DESPACHO.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Record verified artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem 'build55-electron\verified' -File
          $hashes = @{}
          $sizes = @{}
          foreach ($f in $files) {
            $hashes[$f.Name] = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $sizes[$f.Name] = $f.Length
          }
          $obj = [ordered]@{ ok=$true; run_id=[long]$env:GITHUB_RUN_ID; artifact_id=[long]$env:ARTIFACT_ID; hashes=$hashes; sizes=$sizes }
          $json = $obj | ConvertTo-Json -Compress
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $body = @{ message='[skip ci] record Sistema Notas 5.5 Windows artifact'; content=$content; branch='main' } | ConvertTo-Json -Compress
          $body | gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/$env:GITHUB_REPOSITORY/contents/.build55-result.json" --input -
