name: Probe Build 5.6
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe56-temp.yml]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record latest build56 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 8
          DATA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-sistema-notas-56-three-apps.yml/runs?per_page=3")
          CONTENT=$(printf '%s' "$DATA" | base64 -w0)
          jq -n --arg message '[skip ci] probe build56' --arg content "$CONTENT" --arg branch main '{message:$message,content:$content,branch:$branch}' | gh api --method PUT -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/contents/.build56-probe.json" --input -
