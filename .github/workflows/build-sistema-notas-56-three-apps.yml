name: Build Sistema Notas 5.6 Three Apps

on:
  push:
    branches: [main]
    paths: [.github/workflows/build-sistema-notas-56-three-apps.yml]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build original backend without browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srcDir = Join-Path $env:GITHUB_WORKSPACE 'SISTEMA_NOTAS_LOCAL_4_6\codigo_fuente'
          $main = Join-Path $srcDir 'main.go'
          $s = Get-Content $main -Raw
          $s = $s -replace "`r`n", "`n"
          $s = $s.Replace('appVersion     = "4.6.0-buscador-resultados-sin-select"', 'appVersion     = "5.6.0-tres-apps"')
          $oldBrowser = @'
	go func() {
		time.Sleep(650 * time.Millisecond)
		openBrowser(baseURL)
	}()
'@
          $newBrowser = @'
	if strings.TrimSpace(os.Getenv("SISTEMA_NOTAS_NO_BROWSER")) != "1" {
		go func() {
			time.Sleep(650 * time.Millisecond)
			openBrowser(baseURL)
		}()
	}
'@
          if (-not $s.Contains($oldBrowser)) { throw 'No se encontró el bloque openBrowser.' }
          $s = $s.Replace($oldBrowser, $newBrowser)
          $oldRoot = @'
func applicationDir() (string, error) {
	exe, err := os.Executable()
	if err != nil {
		return "", err
	}
	return filepath.Dir(exe), nil
}
'@
          $newRoot = @'
func applicationDir() (string, error) {
	if root := strings.TrimSpace(os.Getenv("SISTEMA_NOTAS_ROOT")); root != "" {
		if err := os.MkdirAll(root, 0755); err != nil {
			return "", err
		}
		return root, nil
	}
	exe, err := os.Executable()
	if err != nil {
		return "", err
	}
	return filepath.Dir(exe), nil
}
'@
          if (-not $s.Contains($oldRoot)) { throw 'No se encontró applicationDir.' }
          $s = $s.Replace($oldRoot, $newRoot)
          Set-Content -Path $main -Value $s -Encoding utf8 -NoNewline
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE '.build56'
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null
          Push-Location $srcDir
          go test .\main.go
          go build -trimpath -ldflags "-H windowsgui -s -w" -o (Join-Path $buildRoot 'backend.exe') .\main.go
          Pop-Location

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create desktop wrappers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:GITHUB_WORKSPACE '.build56\electron'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          @'
{
  "name":"sistema-notas-56",
  "version":"5.6.0",
  "private":true,
  "devDependencies":{"electron":"43.3.0","electron-builder":"26.0.12"}
}
'@ | Set-Content (Join-Path $work 'package.json') -Encoding utf8

          @'
const { BrowserWindow, dialog } = require('electron');
const os = require('os');
const http = require('http');
const dgram = require('dgram');
const FIRST_PORT = 8765, LAST_PORT = 8795, DISCOVERY_PORT = 18766;
const TOKEN = 'SISTEMA_NOTAS_SERVIDOR_56';
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function localIPv4(){const out=[];for(const list of Object.values(os.networkInterfaces()))for(const x of list||[])if(x.family==='IPv4'&&!x.internal&&x.address)out.push(x.address);return [...new Set(out)];}
function firstLan(){return localIPv4()[0]||'127.0.0.1';}
function statusAt(host,port,timeout=700){return new Promise(resolve=>{const req=http.get({host,port,path:'/api/status',timeout},res=>{let b='';res.setEncoding('utf8');res.on('data',c=>b+=c);res.on('end',()=>{try{const d=JSON.parse(b);resolve(res.statusCode===200&&d&&d.ok&&d.family==='sistema-notas-local'?{ok:true,url:`http://${host}:${port}/`,port,data:d}:{ok:false});}catch{resolve({ok:false});}})});req.on('timeout',()=>req.destroy());req.on('error',()=>resolve({ok:false}));});}
async function findLocalServer(limit=15000){const end=Date.now()+limit;while(Date.now()<end){for(let p=FIRST_PORT;p<=LAST_PORT;p++){const s=await statusAt('127.0.0.1',p,250);if(s.ok)return s;}await sleep(200);}return null;}
function startResponder(getPort){const s=dgram.createSocket({type:'udp4',reuseAddr:true});s.on('error',()=>{});s.on('message',(m,r)=>{if(m.toString('utf8').trim()!==TOKEN)return;const p=Number(getPort());if(!p)return;const payload=Buffer.from(JSON.stringify({family:'sistema-notas-local',url:`http://${firstLan()}:${p}/`}));s.send(payload,r.port,r.address,()=>{});});try{s.bind(DISCOVERY_PORT,'0.0.0.0');}catch{}return s;}
function discoverUdp(timeout=2000){return new Promise(resolve=>{const s=dgram.createSocket('udp4');let done=false;const finish=v=>{if(done)return;done=true;try{s.close();}catch{}resolve(v);};s.on('error',()=>finish(null));s.on('message',async m=>{try{const d=JSON.parse(m.toString('utf8'));if(d.family!=='sistema-notas-local'||!d.url)return;const u=new URL(d.url);const chk=await statusAt(u.hostname,Number(u.port||FIRST_PORT),800);if(chk.ok)finish(chk.url);}catch{}});s.bind(0,()=>{try{s.setBroadcast(true);const b=Buffer.from(TOKEN);s.send(b,DISCOVERY_PORT,'255.255.255.255',()=>{});for(const ip of localIPv4()){const a=ip.split('.');if(a.length===4){a[3]='255';s.send(b,DISCOVERY_PORT,a.join('.'),()=>{});}}}catch{}});setTimeout(()=>finish(null),timeout);});}
async function scanSubnet(){for(const prefix of [...new Set(localIPv4().map(ip=>ip.split('.').slice(0,3).join('.')))]){for(let port=FIRST_PORT;port<=LAST_PORT;port++){let idx=1,found=null;const workers=Array.from({length:80},async()=>{while(!found&&idx<=254){const host=`${prefix}.${idx++}`;const s=await statusAt(host,port,180);if(s.ok){found=s.url;break;}}});await Promise.all(workers);if(found)return found;}}return null;}
async function resolveServer(){let u=await discoverUdp();if(u)return u;return await scanSubnet();}
function openNotes(url,role){const win=new BrowserWindow({width:1500,height:930,minWidth:1050,minHeight:720,show:false,autoHideMenuBar:true,backgroundColor:'#dedede',title:role==='supervisor'?'APP SUPERVISOR — Sistema de Notas':'APP DESPACHO — Sistema de Notas',webPreferences:{nodeIntegration:false,contextIsolation:true,sandbox:true,spellcheck:true,backgroundThrottling:false}});win.setMenuBarVisibility(false);win.webContents.setWindowOpenHandler(()=>({action:'deny'}));win.once('ready-to-show',()=>{win.maximize();win.show();});win.loadURL(url).catch(async e=>{await dialog.showMessageBox(win,{type:'error',title:'Sistema de Notas',message:'No se pudo cargar la interfaz.',detail:String(e?.message||e)});});return win;}
async function waitForServer(){while(true){const url=await resolveServer();if(url)return url;const r=await dialog.showMessageBox({type:'warning',title:'Sistema de Notas',message:'No se encontró APP SERVIDOR.',detail:'Abre APP SERVIDOR en la PC servidor y verifica que las PCs estén conectadas a la misma red.',buttons:['Reintentar','Salir'],defaultId:0,cancelId:1});if(r.response===1)return null;}}
module.exports={findLocalServer,startResponder,openNotes,waitForServer};
'@ | Set-Content (Join-Path $work 'common.js') -Encoding utf8

          @'
const {app,BrowserWindow,dialog}=require('electron');
app.disableHardwareAcceleration();
const path=require('path'),fs=require('fs'),http=require('http');
const {spawn}=require('child_process');
const {findLocalServer,startResponder}=require('./common');
const dataRoot=path.join(process.env.LOCALAPPDATA||app.getPath('appData'),'SistemaNotasServidor');app.setPath('userData',path.join(dataRoot,'Electron'));
let backend=null,responder=null,current=null,win=null,quitting=false;
function backendPath(){return app.isPackaged?path.join(process.resourcesPath,'backend.exe'):path.join(__dirname,'..','backend.exe');}
async function stopBackend(){if(current)try{await new Promise(resolve=>{const u=new URL(current.url);const req=http.request({hostname:u.hostname,port:u.port,path:'/api/shutdown',method:'POST',timeout:600},res=>{res.resume();resolve();});req.on('error',resolve);req.on('timeout',()=>{req.destroy();resolve();});req.end('{}');});}catch{}if(backend&&!backend.killed)try{backend.kill();}catch{}}
function serverWindow(){win=new BrowserWindow({width:620,height:420,resizable:false,autoHideMenuBar:true,title:'APP SERVIDOR — Sistema de Notas',backgroundColor:'#e6edf2',webPreferences:{nodeIntegration:false,contextIsolation:true}});win.setMenuBarVisibility(false);const html=`<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;font-family:Segoe UI,Arial;background:#e6edf2;color:#173d59;display:grid;place-items:center;height:100vh}.card{width:500px;background:white;border:2px solid #173d59;border-radius:20px;padding:30px;text-align:center;box-shadow:0 16px 40px #0002}.dot{width:18px;height:18px;border-radius:50%;background:#20a464;display:inline-block;box-shadow:0 0 0 7px #20a46422}h1{font-size:28px;margin:18px 0 8px}.ok{font-weight:800;font-size:19px}.muted{color:#687985;line-height:1.5;margin-top:15px}.badge{display:inline-block;margin-top:18px;padding:9px 14px;border-radius:999px;background:#edf6f1;color:#16623f;font-weight:800}</style></head><body><div class='card'><span class='dot'></span><h1>APP SERVIDOR</h1><div class='ok'>SERVIDOR ACTIVO</div><div class='muted'>Mantén esta ventana abierta.<br>APP SUPERVISOR y APP DESPACHO se conectan automáticamente.</div><div class='badge'>Sistema de Notas 5.6</div></div></body></html>`;win.loadURL('data:text/html;charset=utf-8,'+encodeURIComponent(html));}
app.whenReady().then(async()=>{fs.mkdirSync(dataRoot,{recursive:true});const exe=backendPath();if(!fs.existsSync(exe)){await dialog.showMessageBox({type:'error',title:'APP SERVIDOR',message:'No se encontró el servidor interno.'});app.quit();return;}backend=spawn(exe,['--servidor'],{windowsHide:true,cwd:dataRoot,env:{...process.env,SISTEMA_NOTAS_ROOT:dataRoot,SISTEMA_NOTAS_NO_BROWSER:'1'},stdio:'ignore'});current=await findLocalServer(16000);if(!current){await dialog.showMessageBox({type:'error',title:'APP SERVIDOR',message:'No se pudo iniciar el servidor.',detail:'Cierra cualquier copia anterior de Sistema de Notas e inténtalo de nuevo.'});app.quit();return;}responder=startResponder(()=>current.port);serverWindow();});
app.on('before-quit',async e=>{if(quitting)return;quitting=true;e.preventDefault();try{responder?.close();}catch{}await stopBackend();app.exit(0);});app.on('window-all-closed',()=>app.quit());
'@ | Set-Content (Join-Path $work 'server.js') -Encoding utf8

          @'
const {app}=require('electron');app.disableHardwareAcceleration();const path=require('path');const {waitForServer,openNotes}=require('./common');const dataRoot=path.join(process.env.LOCALAPPDATA||app.getPath('appData'),'SistemaNotasSupervisor');app.setPath('userData',path.join(dataRoot,'Electron'));app.whenReady().then(async()=>{const url=await waitForServer();if(!url){app.quit();return;}openNotes(url+'?vista=dashboard','supervisor');});app.on('window-all-closed',()=>app.quit());
'@ | Set-Content (Join-Path $work 'supervisor.js') -Encoding utf8

          @'
const {app}=require('electron');app.disableHardwareAcceleration();const path=require('path');const {waitForServer,openNotes}=require('./common');const dataRoot=path.join(process.env.LOCALAPPDATA||app.getPath('appData'),'SistemaNotasDespacho');app.setPath('userData',path.join(dataRoot,'Electron'));app.whenReady().then(async()=>{const url=await waitForServer();if(!url){app.quit();return;}openNotes(url+'?vista=registro','despacho');});app.on('window-all-closed',()=>app.quit());
'@ | Set-Content (Join-Path $work 'despacho.js') -Encoding utf8

          Push-Location $work
          npm install --no-audit --no-fund
          Pop-Location

      - name: Build three portable EXE apps
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:GITHUB_WORKSPACE '.build56\electron'
          $out=Join-Path $env:GITHUB_WORKSPACE '.build56\out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Push-Location $work
          npx electron-builder --win portable --x64 --config.directories.output="$out\server" --config.productName="APP SERVIDOR" --config.appId="mx.c5.sistemanotas.servidor" --config.extraMetadata.main="server.js" --config.artifactName="APP SERVIDOR.exe" --config.extraResources[0].from="$env:GITHUB_WORKSPACE\.build56\backend.exe" --config.extraResources[0].to="backend.exe"
          npx electron-builder --win portable --x64 --config.directories.output="$out\supervisor" --config.productName="APP SUPERVISOR" --config.appId="mx.c5.sistemanotas.supervisor" --config.extraMetadata.main="supervisor.js" --config.artifactName="APP SUPERVISOR.exe"
          npx electron-builder --win portable --x64 --config.directories.output="$out\despacho" --config.productName="APP DESPACHO" --config.appId="mx.c5.sistemanotas.despacho" --config.extraMetadata.main="despacho.js" --config.artifactName="APP DESPACHO.exe"
          Pop-Location
          $dist=Join-Path $env:GITHUB_WORKSPACE '.build56\DIST'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$out\server\APP SERVIDOR.exe" $dist
          Copy-Item "$out\supervisor\APP SUPERVISOR.exe" $dist
          Copy-Item "$out\despacho\APP DESPACHO.exe" $dist
          Get-FileHash "$dist\APP SERVIDOR.exe" -Algorithm SHA256
          Get-FileHash "$dist\APP SUPERVISOR.exe" -Algorithm SHA256
          Get-FileHash "$dist\APP DESPACHO.exe" -Algorithm SHA256

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_NOTAS_5_6_TRES_APPS
          path: .build56/DIST/*.exe
          if-no-files-found: error
          retention-days: 7
