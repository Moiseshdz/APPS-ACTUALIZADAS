name: Build Sistema Notas 5.7B Native Drag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-sistema-notas-57b-native-drag.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Patch interface and build backend
        shell: pwsh
        run: ./build57/patch-and-build-v2.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Electron
        shell: pwsh
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE '.build57\electron'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\build57\*" $work -Recurse -Force
          Push-Location $work
          npm install --no-audit --no-fund
          Pop-Location
      - name: Build three EXE
        shell: pwsh
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE '.build57\electron'
          $out = Join-Path $env:GITHUB_WORKSPACE '.build57\out'
          Push-Location $work
          npx electron-builder --win portable --x64 --config.directories.output="$out\server" --config.productName="APP SERVIDOR" --config.appId="mx.c5.sistemanotas.servidor57b" --config.extraMetadata.main="server.js" --config.artifactName="APP SERVIDOR.exe" --config.extraResources[0].from="$env:GITHUB_WORKSPACE\.build57\backend.exe" --config.extraResources[0].to="backend.exe"
          npx electron-builder --win portable --x64 --config.directories.output="$out\supervisor" --config.productName="APP SUPERVISOR" --config.appId="mx.c5.sistemanotas.supervisor57b" --config.extraMetadata.main="supervisor.js" --config.artifactName="APP SUPERVISOR.exe"
          npx electron-builder --win portable --x64 --config.directories.output="$out\despacho" --config.productName="APP DESPACHO" --config.appId="mx.c5.sistemanotas.despacho57b" --config.extraMetadata.main="despacho.js" --config.artifactName="APP DESPACHO.exe"
          Pop-Location
          $dist = Join-Path $env:GITHUB_WORKSPACE '.build57\DIST'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$out\server\APP SERVIDOR.exe" $dist
          Copy-Item "$out\supervisor\APP SUPERVISOR.exe" $dist
          Copy-Item "$out\despacho\APP DESPACHO.exe" $dist
          Get-FileHash "$dist\APP SERVIDOR.exe" -Algorithm SHA256
          Get-FileHash "$dist\APP SUPERVISOR.exe" -Algorithm SHA256
          Get-FileHash "$dist\APP DESPACHO.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_NOTAS_5_7B_TRES_APPS_NATIVE_DRAG
          path: .build57/DIST/*.exe
          if-no-files-found: error
          retention-days: 7
